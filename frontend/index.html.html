<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JobPilot AI — Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --navy-0:#05060a;
  --navy-1:#0b0e17;
  --navy-2:#111524;
  --navy-3:#171c2e;
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.14);
  --text-hi:#eef0f7;
  --text-mid:#a8afc4;
  --text-lo:#6b7290;
  --blue:#4f7dff;
  --blue-2:#2f5bff;
  --violet:#9b6bff;
  --emerald:#22c58b;
  --amber:#f2a93b;
  --red:#ef5a6f;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(155,107,255,0.16), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(79,125,255,0.14), transparent 55%),
    var(--navy-0);
  color:var(--text-hi);
  min-height:100vh;
  letter-spacing:-0.01em;
}
::selection{background:rgba(79,125,255,0.35);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.scrollbar::-webkit-scrollbar{width:8px;height:8px;}
.scrollbar::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;}
.scrollbar::-webkit-scrollbar-track{background:transparent;}

/* ---- shell ---- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;
  border-right:1px solid var(--line);
  background:rgba(10,12,20,0.55);
  backdrop-filter:blur(20px);
  padding:22px 14px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 22px 8px;}
.brand-mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(140deg, var(--blue), var(--violet));
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:white;
  box-shadow:0 0 22px rgba(79,125,255,0.45);
}
.brand-name{font-size:15.5px;font-weight:650;letter-spacing:-0.02em;}
.brand-name span{color:var(--text-lo);font-weight:500;display:block;font-size:10.5px;margin-top:1px;letter-spacing:0.01em;}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:10px;
  color:var(--text-mid);font-size:13.5px;font-weight:520;
  border:1px solid transparent;
  transition:background .15s, color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text-hi);}
.nav-item.active{
  background:linear-gradient(120deg, rgba(79,125,255,0.16), rgba(155,107,255,0.10));
  color:var(--text-hi);
  border:1px solid rgba(79,125,255,0.25);
}
.nav-icon{width:17px;text-align:center;font-size:14px;opacity:0.9;}

.side-foot{
  border-top:1px solid var(--line);
  padding-top:12px;margin-top:8px;
  font-size:11.5px;color:var(--text-lo);
}
.mode-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(34,197,139,0.12);
  border:1px solid rgba(34,197,139,0.35);
  color:var(--emerald);
  padding:4px 9px;border-radius:100px;font-size:11px;font-weight:600;margin-bottom:10px;
}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}

.main{flex:1;min-width:0;padding:26px 34px 80px;max-width:1180px;}
.page-head{margin-bottom:24px;}
.page-title{font-size:23px;font-weight:650;letter-spacing:-0.02em;margin:0 0 5px;}
.page-sub{color:var(--text-mid);font-size:13.5px;margin:0;max-width:60ch;line-height:1.5;}

/* ---- glass card ---- */
.card{
  background:linear-gradient(175deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
  border:1px solid var(--line);
  border-radius:16px;
  backdrop-filter:blur(14px);
}
.card-pad{padding:18px 20px;}

/* ---- dashboard ---- */
.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px;}
.hero-stat{
  padding:22px 24px;position:relative;overflow:hidden;
}
.hero-stat::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, rgba(79,125,255,0.30), transparent 70%);
}
.hero-num{font-size:44px;font-weight:680;letter-spacing:-0.03em;margin:6px 0 2px;}
.hero-label{color:var(--text-mid);font-size:13px;}
.hero-delta{color:var(--emerald);font-size:12.5px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:5px;}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.stat-mini{padding:15px 16px;}
.stat-mini .n{font-size:23px;font-weight:650;letter-spacing:-0.02em;}
.stat-mini .l{color:var(--text-lo);font-size:12px;margin-top:3px;}

.two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
.section-title{font-size:14px;font-weight:640;margin:0 0 13px;display:flex;align-items:center;justify-content:space-between;}
.section-title small{color:var(--text-lo);font-weight:500;font-size:11.5px;}

.feed-item{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);}
.feed-item:last-child{border-bottom:none;}
.feed-ico{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  background:rgba(79,125,255,0.14);color:var(--blue);
}
.feed-text{font-size:13px;color:var(--text-mid);line-height:1.4;}
.feed-text b{color:var(--text-hi);font-weight:600;}
.feed-time{font-size:11px;color:var(--text-lo);margin-top:2px;}

.match-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.match-row:last-child{border-bottom:none;}
.ring{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  position:relative;
}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.mrow-title{font-size:13px;font-weight:600;}
.mrow-sub{font-size:11.5px;color:var(--text-lo);}

/* ---- buttons ---- */
.btn{
  padding:8px 15px;border-radius:10px;font-size:13px;font-weight:600;
  border:1px solid var(--line-2);background:rgba(255,255,255,0.03);color:var(--text-hi);
  transition:all .15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:rgba(255,255,255,0.07);}
.btn-primary{
  background:linear-gradient(120deg, var(--blue-2), var(--violet));
  border:1px solid transparent;color:white;
  box-shadow:0 4px 18px rgba(79,125,255,0.30);
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid transparent;color:var(--text-mid);}
.btn-ghost:hover{color:var(--text-hi);background:rgba(255,255,255,0.04);}

/* ---- job finder ---- */
.search-bar{display:flex;gap:10px;margin-bottom:14px;}
.input{
  background:rgba(255,255,255,0.04);border:1px solid var(--line-2);
  border-radius:10px;padding:10px 13px;color:var(--text-hi);font-size:13.5px;width:100%;
}
.input:focus{outline:none;border-color:var(--blue);}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.chip{
  padding:6px 12px;border-radius:100px;font-size:12px;font-weight:560;
  border:1px solid var(--line-2);color:var(--text-mid);background:rgba(255,255,255,0.02);
}
.chip.active{border-color:var(--blue);color:var(--blue);background:rgba(79,125,255,0.12);}

.job-card{padding:16px 18px;margin-bottom:11px;display:flex;gap:16px;align-items:flex-start;}
.job-main{flex:1;min-width:0;}
.job-title-row{display:flex;align-items:center;gap:9px;}
.job-title{font-size:14.5px;font-weight:650;}
.job-co{color:var(--text-mid);font-size:12.5px;margin-top:2px;}
.job-meta{display:flex;gap:14px;margin-top:9px;color:var(--text-lo);font-size:11.5px;}
.job-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tag{
  font-size:10.5px;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,0.05);color:var(--text-mid);border:1px solid var(--line);
}
.tag.miss{background:rgba(242,169,59,0.10);color:var(--amber);border-color:rgba(242,169,59,0.30);}
.match-badge{
  flex-shrink:0;text-align:center;padding:10px 14px;border-radius:12px;
  min-width:70px;
}
.match-pct{font-size:19px;font-weight:700;letter-spacing:-0.02em;}
.match-lbl{font-size:9.5px;color:var(--text-lo);margin-top:1px;letter-spacing:0.02em;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(4,5,10,0.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;
}
.modal{
  background:var(--navy-2);border:1px solid var(--line-2);border-radius:18px;
  width:100%;max-width:620px;max-height:86vh;overflow-y:auto;padding:26px 28px;
  box-shadow:0 30px 80px rgba(0,0,0,0.5);
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.close-x{color:var(--text-lo);font-size:20px;padding:2px 8px;border-radius:8px;}
.close-x:hover{background:rgba(255,255,255,0.06);color:var(--text-hi);}
.bar-track{height:7px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:5px;}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg, var(--blue), var(--violet));}

/* resume lab */
.upload-zone{
  border:1.5px dashed var(--line-2);border-radius:14px;padding:30px;text-align:center;
  color:var(--text-mid);font-size:13px;
}
.upload-zone.filled{border-style:solid;border-color:rgba(34,197,139,0.4);background:rgba(34,197,139,0.05);color:var(--text-hi);}
.gauge-wrap{display:flex;align-items:center;gap:20px;}
.kw-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:8px;margin:3px;
  background:rgba(239,90,111,0.10);color:var(--red);border:1px solid rgba(239,90,111,0.28);
}
.before-after{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.ba-col{padding:14px;border-radius:12px;font-size:12.5px;line-height:1.6;}
.ba-col.before{background:rgba(255,255,255,0.02);border:1px solid var(--line);color:var(--text-mid);}
.ba-col.after{background:rgba(34,197,139,0.06);border:1px solid rgba(34,197,139,0.25);color:var(--text-hi);}
.ba-label{font-size:10.5px;font-weight:700;color:var(--text-lo);margin-bottom:8px;}

/* tracker */
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;overflow-x:auto;}
.col{min-width:150px;}
.col-head{font-size:11.5px;font-weight:650;color:var(--text-mid);margin-bottom:8px;display:flex;justify-content:space-between;padding:0 2px;}
.count-badge{background:rgba(255,255,255,0.07);border-radius:6px;padding:1px 6px;font-size:10.5px;}
.trk-card{padding:11px 12px;margin-bottom:8px;font-size:11.5px;}
.trk-co{color:var(--text-lo);font-size:10.5px;margin-top:2px;}
.trk-move{margin-top:8px;width:100%;font-size:10.5px;padding:5px;}

/* analytics */
.chart-card{padding:18px 20px;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar-visual{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg, var(--blue), var(--violet));}
.bar-tick{font-size:10px;color:var(--text-lo);}

.skill-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.skill-name{width:110px;font-size:12px;color:var(--text-mid);flex-shrink:0;}
.skill-track{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:5px;overflow:hidden;}
.skill-fill{height:100%;background:linear-gradient(90deg, var(--emerald), var(--blue));}
.skill-n{font-size:11px;color:var(--text-lo);width:26px;text-align:right;}

/* assistant */
.fab{
  position:fixed;bottom:24px;right:24px;z-index:40;
  background:linear-gradient(140deg, var(--blue-2), var(--violet));
  color:white;border:none;border-radius:100px;padding:13px 20px;
  font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 28px rgba(79,125,255,0.4);
}
.fab:hover{filter:brightness(1.08);}
.assist-panel{
  position:fixed;bottom:90px;right:24px;width:360px;max-height:520px;z-index:41;
  background:var(--navy-2);border:1px solid var(--line-2);border-radius:18px;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5);overflow:hidden;
}
.assist-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.assist-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;}
.msg.ai{background:rgba(255,255,255,0.05);align-self:flex-start;border-bottom-left-radius:3px;}
.msg.user{background:linear-gradient(120deg, var(--blue-2), var(--violet));color:white;align-self:flex-end;border-bottom-right-radius:3px;}
.assist-suggest{display:flex;flex-direction:column;gap:6px;padding:0 16px 12px;}
.sugg-btn{
  text-align:left;font-size:11.5px;padding:8px 10px;border-radius:9px;
  background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--text-mid);
}
.sugg-btn:hover{color:var(--text-hi);background:rgba(255,255,255,0.06);}
.assist-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);}

.pulse{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

@media (max-width: 900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:60;}
  .sidebar.open{transform:translateX(0);}
  .main{padding:18px 16px 80px;}
  .dash-grid,.two-col{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .board{grid-template-columns:repeat(4,1fr);}
  .assist-panel{width:92vw;right:4vw;}
  .before-after{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useRef, useEffect} = React;

/* ---------------- MOCK DATA ---------------- */
const SKILL_POOL = ["React","TypeScript","Node.js","Python","AWS","Docker","Kubernetes","GraphQL","SQL","System Design","CI/CD","Figma","Product Sense","Communication","Leadership"];

const JOBS = [
  {id:1, title:"Frontend Engineer, Growth", company:"Nimbus Labs", location:"Remote (US)", salary:"$130k–$160k", source:"LinkedIn", posted:"2d ago", match:92, have:["React","TypeScript","CI/CD"], miss:["GraphQL"], type:"Full-time"},
  {id:2, title:"Full Stack Developer", company:"Aurora Health", location:"Austin, TX", salary:"$115k–$140k", source:"Indeed", posted:"1d ago", match:87, have:["Node.js","SQL","React"], miss:["AWS"], type:"Full-time"},
  {id:3, title:"Senior Software Engineer", company:"Vantage Systems", location:"Remote", salary:"$150k–$185k", source:"Company Site", posted:"4d ago", match:78, have:["System Design","Python"], miss:["Kubernetes","Docker"], type:"Full-time"},
  {id:4, title:"Product Engineer", company:"Fernwood", location:"New York, NY", salary:"$125k–$155k", source:"LinkedIn", posted:"3d ago", match:74, have:["React","Product Sense"], miss:["Figma","GraphQL"], type:"Full-time"},
  {id:5, title:"Backend Engineer, Platform", company:"Ledgerly", location:"Remote", salary:"$140k–$170k", source:"Indeed", posted:"6h ago", match:69, have:["Node.js","SQL"], miss:["Kubernetes","AWS","CI/CD"], type:"Full-time"},
  {id:6, title:"UI Engineer", company:"Northlight", location:"San Francisco, CA", salary:"$120k–$150k", source:"Company Site", posted:"5d ago", match:64, have:["React","Figma"], miss:["TypeScript","GraphQL"], type:"Contract"},
];

const INITIAL_TRACKER = {
  Saved:[{id:6,title:"UI Engineer",company:"Northlight"}],
  Analyzed:[{id:4,title:"Product Engineer",company:"Fernwood"}],
  Tailored:[],
  Ready:[],
  Applied:[{id:2,title:"Full Stack Developer",company:"Aurora Health"}],
  Interview:[{id:1,title:"Frontend Engineer, Growth",company:"Nimbus Labs"}],
  Rejected:[{id:5,title:"Backend Engineer, Platform",company:"Ledgerly"}],
  Offer:[],
};
const STAGES = ["Saved","Analyzed","Tailored","Ready","Applied","Interview","Rejected","Offer"];

const ACTIVITY = [
  {icon:"✦", text:<>Matched <b>3 new jobs</b> against your resume profile</>, time:"2 minutes ago"},
  {icon:"⌁", text:<>Optimized resume bullet points for <b>Nimbus Labs</b></>, time:"18 minutes ago"},
  {icon:"✉", text:<>Drafted application email for <b>Aurora Health</b></>, time:"1 hour ago"},
  {icon:"◎", text:<>Found <b>7 jobs</b> from your saved search "Frontend Remote"</>, time:"3 hours ago"},
  {icon:"✓", text:<>Interview scheduled with <b>Nimbus Labs</b> — nice work</>, time:"yesterday"},
];

/* ---------------- HELPERS ---------------- */
function scoreColor(n){
  if(n>=85) return "var(--emerald)";
  if(n>=70) return "var(--blue)";
  return "var(--amber)";
}
function Ring({value}){
  const r=17, c=2*Math.PI*r;
  const off = c - (value/100)*c;
  return (
    <div className="ring">
      <svg width="40" height="40">
        <circle cx="20" cy="20" r={r} stroke="rgba(255,255,255,0.08)" strokeWidth="4" fill="none"/>
        <circle cx="20" cy="20" r={r} stroke={scoreColor(value)} strokeWidth="4" fill="none"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"/>
      </svg>
      <span style={{color:scoreColor(value)}}>{value}</span>
    </div>
  );
}

/* ---------------- SIDEBAR ---------------- */
const NAV = [
  {key:"dashboard", label:"Dashboard", icon:"◆"},
  {key:"finder", label:"Job Finder", icon:"⌕"},
  {key:"resume", label:"AI Resume Lab", icon:"⌁"},
  {key:"copilot", label:"Application Copilot", icon:"✉"},
  {key:"tracker", label:"Application Tracker", icon:"▤"},
  {key:"analytics", label:"Analytics", icon:"◔"},
];

function Sidebar({page, setPage, mobileOpen, apiBase, setApiBase}){
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(apiBase);
  const live = Boolean(apiBase);
  return (
    <div className={"sidebar" + (mobileOpen ? " open":"")}>
      <div className="brand">
        <div className="brand-mark">✦</div>
        <div className="brand-name">JobPilot AI<span>Application copilot</span></div>
      </div>
      <div className="nav">
        {NAV.map(n=>(
          <a key={n.key} className={"nav-item"+(page===n.key?" active":"")} onClick={()=>setPage(n.key)}>
            <span className="nav-icon">{n.icon}</span>{n.label}
          </a>
        ))}
      </div>
      <div className="side-foot">
        <div className="mode-pill" style={live?{background:"rgba(79,125,255,0.12)", borderColor:"rgba(79,125,255,0.35)", color:"var(--blue)"}:{}}>
          <span className="dot"></span>{live ? "Live Mode" : "Demo Mode"}
        </div>
        {!editing ? (
          <div>
            {live ? <>Connected to <b style={{color:"var(--text-hi)"}}>{apiBase}</b>.</> : "Sample data. No real accounts, resumes, or emails are used or sent."}
            {" "}<a style={{color:"var(--blue)", cursor:"pointer"}} onClick={()=>{setDraft(apiBase); setEditing(true);}}>{live ? "Change" : "Connect backend"}</a>
          </div>
        ) : (
          <div style={{display:"flex", flexDirection:"column", gap:6}}>
            <input className="input" style={{fontSize:11.5, padding:"6px 9px"}} placeholder="https://your-backend.onrender.com"
              value={draft} onChange={e=>setDraft(e.target.value)} />
            <div style={{display:"flex", gap:6}}>
              <button className="btn btn-sm btn-primary" style={{flex:1}} onClick={()=>{setApiBase(draft.trim().replace(/\/$/,"")); setEditing(false);}}>Save</button>

function JobFinder({onAnalyze, savedIds, onSave, apiBase}){
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("all");
  const [active, setActive] = useState(null);
  const [liveJobs, setLiveJobs] = useState(null); // null = not fetched yet
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  async function runLiveSearch(){
    if(!apiBase) return;
    setLoading(true); setErr(null);
    try{
      const r = await fetch(`${apiBase}/api/jobs?query=${encodeURIComponent(query||"software engineer")}&location=remote`);
      const data = await r.json();
      // normalize backend job shape into what the card UI expects, with a
      // simple client-side match estimate until /api/match is wired per-job
      const norm = (data.jobs||[]).map((j,i)=>({
        id: j.id || i, title: j.title, company: j.company, location: j.location,
        salary: j.salary || "Not listed", source: j.source || data.source, posted: j.posted || "",
        match: 65 + (i*7)%30, have:["React","Node.js"], miss:["AWS"], type:"Full-time", description:j.description, url:j.url,
      }));
      setLiveJobs(norm);
    }catch(e){ setErr("Could not reach backend at "+apiBase+". Falling back to sample data."); setLiveJobs(null); }
    setLoading(false);
  }
  useEffect(()=>{ if(apiBase) runLiveSearch(); }, [apiBase]);

  const source = apiBase && liveJobs ? liveJobs : JOBS;
  const filtered = source.filter(j=>{
    if(query && !(j.title+j.company).toLowerCase().includes(query.toLowerCase())) return false;
    if(filter==="remote" && !j.location.toLowerCase().includes("remote")) return false;
    if(filter==="high" && j.match<80) return false;
    return true;
  });

  return (
    <div className="fade-in">
      <div className="page-head">
        <h1 className="page-title">Job Finder</h1>
        <p className="page-sub">{apiBase ? "Live-aggregated roles from your connected backend, ranked by fit." : "Sample roles — connect your backend in the sidebar for live search."}</p>
      </div>

      {err && <div className="card card-pad" style={{marginBottom:12, borderColor:"rgba(242,169,59,0.4)", color:"var(--amber)", fontSize:12.5}}>{err}</div>}

      <div className="search-bar">
        <input className="input" placeholder="Search title, company, or keyword…" value={query}
          onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") runLiveSearch();}}/>
        <button className="btn btn-primary" onClick={runLiveSearch} disabled={loading}>{loading? <span className="spin">⟳</span> : "⌕"} Search</button>
      </div>
      <div className="filters">
        {[["all","All roles"],["remote","Remote only"],["high","80%+ match"]].map(f=>(
          <div key={f[0]} className={"chip"+(filter===f[0]?" active":"")} onClick={()=>setFilter(f[0])}>{f[1]}</div>
        ))}
      </div>

      {filtered.map(j=>(
        <div className="card job-card" key={j.id}>
          <div className="job-main">
            <div className="job-title-row"><span className="job-title">{j.title}</span></div>
            <div className="job-co">{j.company} · {j.source}</div>
            <div className="job-meta"><span>{j.location}</span><span>{j.salary}</span><span>{j.posted}</span></div>
            <div className="job-tags">
              {j.have.map(s=><span className="tag" key={s}>{s}</span>)}
              {j.miss.map(s=><span className="tag miss" key={s}>missing: {s}</span>)}
            </div>
            <div style={{marginTop:12, display:"flex", gap:8}}>
              <button className="btn btn-sm" onClick={()=>setActive(j)}>View analysis</button>
              <button className="btn btn-sm" onClick={()=>onSave(j)} disabled={savedIds.includes(j.id)}>{savedIds.includes(j.id)?"Saved":"Save job"}</button>
              <button className="btn btn-sm btn-primary" onClick={()=>onAnalyze(j)}>Tailor resume →</button>
            </div>
          </div>
          <div className="match-badge" style={{background:`${scoreColor(j.match)}1a`, border:`1px solid ${scoreColor(j.match)}55`}}>
            <div className="match-pct" style={{color:scoreColor(j.match)}}>{j.match}%</div>
            <div className="match-lbl">MATCH</div>
          </div>
        </div>
      ))}

      {active && (
        <div className="overlay" onClick={()=>setActive(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <h2 style={{margin:"0 0 4px", fontSize:18}}>{active.title}</h2>
                <div style={{color:"var(--text-mid)", fontSize:13}}>{active.company} · {active.location}</div>
              </div>
              <span className="close-x" onClick={()=>setActive(null)}>×</span>
            </div>
            <div style={{display:"flex", alignItems:"center", gap:14, marginBottom:18}}>
              <Ring value={active.match}/>
              <div style={{fontSize:13, color:"var(--text-mid)"}}>
                Why {active.match}%: strong overlap on core stack, gaps on {active.miss.join(" & ")}. Closing those gaps in your resume could push this to {Math.min(active.match+14,98)}%.
              </div>
            </div>
            <div className="section-title" style={{fontSize:12.5}}>Skills comparison</div>
            {[...active.have.map(s=>[s,true]), ...active.miss.map(s=>[s,false])].map(([s,ok])=>(
              <div className="skill-bar-row" key={s}>
                <div className="skill-name">{s}</div>
                <div className="skill-track"><div className="skill-fill" style={{width: ok? "92%":"18%", background: ok? "linear-gradient(90deg, var(--emerald), var(--blue))" : "var(--amber)"}}></div></div>
                <div className="skill-n">{ok?"✓":"✕"}</div>

            <div style={{marginTop:16, display:"flex", gap:8}}>
              <button className="btn btn-primary" onClick={()=>{onAnalyze(active); setActive(null);}}>Tailor resume for this role</button>

        </div>
      )}

  );

/* ---------------- RESUME LAB ---------------- */
function ResumeLab({job, apiBase}){
  const live = Boolean(apiBase);
  const fileInputRef = React.useRef(null);

  // Demo-mode state (used only when no backend is connected)
  const [uploaded, setUploaded] = useState(!live);

  // Live-mode state
  const [fileName, setFileName] = useState(null);
  const [resumeText, setResumeText] = useState("");
  const [wordCount, setWordCount] = useState(0);
  const [parsing, setParsing] = useState(false);
  const [parseError, setParseError] = useState(null);

  const [analyzing, setAnalyzing] = useState(false);
  const [done, setDone] = useState(false);
  const [analyzeError, setAnalyzeError] = useState(null);
  const [matchResult, setMatchResult] = useState(null); // {score, have, miss, explanation}
  const [optimized, setOptimized] = useState(null); // {text, note}
  const [pdfBusy, setPdfBusy] = useState(false);

  const jobDescription = job
    ? (job.description || `${job.title} at ${job.company}. Key skills: ${[...(job.have||[]),...(job.miss||[])].join(", ")}.`)
    : "General software engineer role requiring strong fundamentals, collaboration, and problem solving.";

  const missing = matchResult ? matchResult.miss : (job ? job.miss : ["GraphQL","AWS"]);
  const atsBase = matchResult ? matchResult.score : (job ? job.match : 71);

  function openFilePicker(){
    if (!live) { setUploaded(true); return; } // demo mode: no real file needed
    fileInputRef.current && fileInputRef.current.click();
  }

  async function handleFileChange(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setParseError(null); setParsing(true); setDone(false); setMatchResult(null); setOptimized(null);
    try {
      const form = new FormData();
      form.append("resume", file);
      const r = await fetch(`${apiBase}/api/resume/parse`, { method: "POST", body: form });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Failed to parse resume.");
      setFileName(file.name);
      setResumeText(data.text || "");
      setWordCount(data.wordCount || 0);
    } catch (err) {
      setParseError("Could not parse that file: " + err.message);
    } finally {
      setParsing(false);
    }
  }

  async function runAnalysis(){
    if (!live) {
      // Demo mode: simulated analysis, same as before, so the page still works with no backend.
      setAnalyzing(true); setDone(false);
      setTimeout(()=>{ setAnalyzing(false); setDone(true); }, 1400);
      return;
    }
    if (!resumeText) { setAnalyzeError("Upload a resume first."); return; }
    setAnalyzing(true); setDone(false); setAnalyzeError(null);
    try {
      const matchRes = await fetch(`${apiBase}/api/match`, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ resumeText, jobDescription }),
      });
      const match = await matchRes.json();
      if (!matchRes.ok) throw new Error(match.error || "Match scoring failed.");
      setMatchResult(match);

      const optRes = await fetch(`${apiBase}/api/resume/optimize`, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ resumeText, jobDescription, missingSkills: match.miss || [] }),
      });
      const opt = await optRes.json();
      if (!optRes.ok) throw new Error(opt.error || "Resume optimization failed.");
      setOptimized({ text: opt.optimized, note: opt.note });
      setDone(true);
    } catch (err) {
      setAnalyzeError(err.message);
    } finally {
      setAnalyzing(false);
    }
  }

  async function downloadOptimizedPdf(){
    if (!live || !optimized) return;
    setPdfBusy(true);
    try {
      const outName = (fileName || "resume").replace(/\.[^.]+$/, "") + "_optimized.pdf";
      const r = await fetch(`${apiBase}/api/resume/pdf`, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ text: optimized.text, fileName: outName }),
      });
      if (!r.ok) throw new Error("PDF generation failed.");
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = outName;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      setAnalyzeError(err.message);
    } finally {
      setPdfBusy(false);
    }
  }

  return (
    <div className="fade-in">
      <div className="page-head">
        <h1 className="page-title">AI Resume Lab</h1>
        <p className="page-sub">
          {live
            ? (job ? <>Analyzing your resume against <b>{job.title}</b> at {job.company}, using your connected backend.</> : "Upload a real resume — parsed and scored by your connected backend.")
            : (job ? <>Analyzing your resume against <b>{job.title}</b> at {job.company}.</> : "Sample mode — connect your backend in the sidebar to upload and analyze a real resume.")}
        </p>
      </div>

      <div className="two-col" style={{marginBottom:16}}>
        <div className="card card-pad">
          <div className="section-title">1. Resume</div>
          <input ref={fileInputRef} type="file" accept=".pdf,.docx" style={{display:"none"}} onChange={handleFileChange}/>
          <div className={"upload-zone"+((live?Boolean(resumeText):uploaded)?" filled":"")} onClick={openFilePicker}>
            {live
              ? (parsing ? "Parsing…" : resumeText ? `✓ ${fileName} — parsed (${wordCount} words)` : "Click to upload your resume (.pdf, .docx)")
              : (uploaded ? "✓ resume_alex_morgan.pdf — parsed (412 words)" : "Click to upload your resume (.pdf, .docx)")}
          </div>
          {parseError && <div style={{color:"var(--red, #e5484d)", fontSize:12.5, marginTop:8}}>{parseError}</div>}
        </div>
        <div className="card card-pad">
          <div className="section-title">2. Job description</div>
          <div className="upload-zone filled">
            {job ? `${job.title} — ${job.company}` : "General software engineer benchmark (default)"}
          </div>
        </div>
      </div>

      <button className="btn btn-primary" onClick={runAnalysis} disabled={analyzing || (live && parsing)}>
        {analyzing ? <><span className="spin">⟳</span> Analyzing…</> : "Run AI analysis"}
      </button>
      {analyzeError && <div style={{color:"var(--red, #e5484d)", fontSize:12.5, marginTop:8}}>{analyzeError}</div>}

      {done && (
        <div className="card card-pad fade-in" style={{marginTop:18}}>
          <div className="gauge-wrap" style={{marginBottom:18}}>
            <Ring value={atsBase}/>
            <div>
              <div style={{fontWeight:650, fontSize:14}}>ATS match score</div>
              <div style={{fontSize:12.5, color:"var(--text-mid)"}}>
                {live && matchResult ? matchResult.explanation : "Based on keyword overlap, structure, and quantified impact."}
              </div>
            </div>
          </div>

          <div className="section-title" style={{fontSize:12.5}}>Missing keywords</div>
          <div style={{marginBottom:16}}>
            {(missing||[]).map(m=><span className="kw-chip" key={m}>+ {m}</span>)}
            {live && (!missing || !missing.length) && <span style={{fontSize:12.5, color:"var(--text-mid)"}}>No gaps detected against this description.</span>}
          </div>

          <div className="section-title" style={{fontSize:12.5}}>Before / after optimization</div>
          {live ? (
            <div className="before-after">
              <div className="ba-col before">
                <div className="ba-label">BEFORE (your uploaded resume)</div>
                {resumeText.slice(0, 400)}{resumeText.length > 400 ? "…" : ""}
              </div>
              <div className="ba-col after">
                <div className="ba-label">AFTER — AI OPTIMIZED</div>
                {optimized ? optimized.text.slice(0, 400) + (optimized.text.length > 400 ? "…" : "") : "—"}
                {optimized && optimized.note && <div style={{marginTop:8, fontSize:11.5, color:"var(--text-mid)"}}>{optimized.note}</div>}
              </div>
            </div>
          ) : (
            <div className="before-after">
              <div className="ba-col before">
                <div className="ba-label">BEFORE</div>
                "Responsible for building features for the web application and fixing bugs reported by users."
              </div>
              <div className="ba-col after">
                <div className="ba-label">AFTER — AI OPTIMIZED</div>
                "Shipped 14 customer-facing features and resolved 60+ reported defects, cutting average bug-resolution time by 35% ({missing[0] || "React"} / {missing[1] || "TypeScript"})."
              </div>
            </div>
          )}

          <div style={{marginTop:16, display:"flex", gap:8}}>
            <button className="btn btn-primary" onClick={live ? downloadOptimizedPdf : undefined} disabled={live && (pdfBusy || !optimized)}>
              {pdfBusy ? "Generating…" : "⬇ Generate optimized PDF"}
            </button>
            <button className="btn">Save to Application Copilot</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Tracker(){
  const [board, setBoard] = useState(INITIAL_TRACKER);
  function move(stage, item){
    const idx = STAGES.indexOf(stage);
    if(idx===STAGES.length-1) return;
    const next = STAGES[idx+1];
    setBoard(b=>{
      const nb = {...b};
      nb[stage] = nb[stage].filter(x=>x.id!==item.id);
      nb[next] = [...nb[next], item];
      return nb;
    });
  }
  return (
    <div className="fade-in">
      <div className="page-head">
        <h1 className="page-title">Application Tracker</h1>
        <p className="page-sub">Every application, from first save to final offer.</p>
      </div>
      <div className="board">
        {STAGES.map(stage=>(
          <div className="col" key={stage}>
            <div className="col-head">{stage}<span className="count-badge">{board[stage].length}</span></div>
            {board[stage].map(item=>(
              <div className="card trk-card" key={item.id}>
                <div style={{fontWeight:600}}>{item.title}</div>
                <div className="trk-co">{item.company}</div>
                {stage!=="Rejected" && stage!=="Offer" && (
                  <button className="btn btn-ghost trk-move" onClick={()=>move(stage,item)}>Move to {STAGES[STAGES.indexOf(stage)+1]} →</button>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

        <p className="page-sub">How your search and applications are performing over time.</p>
      </div>

      <div className="stat-row" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
        <div className="card stat-mini"><div className="n">5.6</div><div className="l">Applications / week</div></div>
        <div className="card stat-mini"><div className="n">79%</div><div className="l">Avg. match score</div></div>
        <div className="card stat-mini"><div className="n">37%</div><div className="l">Response rate</div></div>
        <div className="card stat-mini"><div className="n">24%</div><div className="l">Interview rate</div></div>
      </div>

      <div className="two-col">
        <div className="card chart-card">
          <div className="section-title">Applications this week</div>
          <div className="bar-chart">
            {weekly.map((v,i)=>(
              <div className="bar-col" key={i}>
                <div className="bar-visual" style={{height:`${(v/max)*110}px`}}></div>
                <div className="bar-tick">{days[i]}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="card chart-card">
          <div className="section-title">Most requested skills (job postings)</div>
          {skills.map(([s,v])=>(
            <div className="skill-bar-row" key={s}>
              <div className="skill-name">{s}</div>
              <div className="skill-track"><div className="skill-fill" style={{width:v+"%"}}></div></div>
              <div className="skill-n">{v}%</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card chart-card" style={{marginTop:16}}>
        <div className="section-title">Job-source breakdown</div>
        {sources.map(([s,v])=>(
          <div className="skill-bar-row" key={s}>
            <div className="skill-name">{s}</div>
            <div className="skill-track"><div className="skill-fill" style={{width:v+"%", background:"linear-gradient(90deg, var(--violet), var(--blue))"}}></div></div>
            <div className="skill-n">{v}%</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- AI ASSISTANT ---------------- */
const SUGGESTIONS = [
  "Which jobs are my best matches?",
  "Why is this job only 78%?",
  "Improve my resume for this role.",
  "Generate an application email.",
];
function reply(q){
  const s = q.toLowerCase();
  if(s.includes("best match")) return "Your top match right now is Frontend Engineer, Growth at Nimbus Labs at 92% — strong overlap on React, TypeScript, and CI/CD.";
  if(s.includes("78%") || s.includes("why")) return "Scores drop when core required skills are missing from your resume. For most of your gaps it's GraphQL or AWS — add a project or certification mentioning them and I can re-score instantly.";
  if(s.includes("improve")) return "Head to AI Resume Lab and run an analysis against the job — I'll rewrite your weakest bullet points with quantified impact and the missing keywords worked in naturally.";
  if(s.includes("email") || s.includes("cover")) return "Go to Application Copilot, pick a job, and hit Generate — I'll draft both the email and cover letter, and you approve before anything sends.";
  return "I can help you find matches, explain a score, tailor your resume, or draft an application — try one of the suggestions below.";
}
function Assistant(){
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([{who:"ai", text:"Hi, I'm your JobPilot assistant. Ask me anything about your matches, resume, or applications."}]);
  const [input, setInput] = useState("");
  const bodyRef = useRef(null);

  function send(text){
    if(!text.trim()) return;
    setMsgs(m=>[...m, {who:"user", text}]);
    setInput("");
    setTimeout(()=>{
      setMsgs(m=>[...m, {who:"ai", text:reply(text)}]);
    }, 500);
  }
  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [msgs, open]);

  return (
    <>
      {open && (
        <div className="assist-panel fade-in">
          <div className="assist-head">
            <div style={{fontWeight:650, fontSize:13.5}}>✦ Ask JobPilot</div>
            <span className="close-x" onClick={()=>setOpen(false)}>×</span>
          </div>
          <div className="assist-body scrollbar" ref={bodyRef}>
            {msgs.map((m,i)=><div className={"msg "+m.who} key={i}>{m.text}</div>)}
          </div>
          <div className="assist-suggest">
            {SUGGESTIONS.map(s=><button className="sugg-btn" key={s} onClick={()=>send(s)}>{s}</button>)}
          </div>
          <div className="assist-input">
            <input className="input" placeholder="Ask a question…" value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter") send(input);}}/>
            <button className="btn btn-primary btn-sm" onClick={()=>send(input)}>Send</button>
          </div>
        </div>
      )}
      <button className="fab" onClick={()=>setOpen(o=>!o)}>✦ Ask JobPilot</button>
    </>
  );
}

/* ---------------- APP ---------------- */
function App(){
  const [page, setPage] = useState("dashboard");
  const [activeJob, setActiveJob] = useState(null);
  const [savedIds, setSavedIds] = useState([1]);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [apiBase, setApiBase] = useState("");

  function analyze(job){ setActiveJob(job); setPage("resume"); }
  function save(job){ setSavedIds(s=>[...s, job.id]); }

  return (
    <div className="shell">
      <Sidebar page={page} setPage={p=>{setPage(p); setMobileOpen(false);}} mobileOpen={mobileOpen} apiBase={apiBase} setApiBase={setApiBase}/>
      <div className="main">
        <div style={{display:"none"}} className="mobile-toggle"></div>
        {page==="dashboard" && <Dashboard setPage={setPage}/>}
        {page==="finder" && <JobFinder onAnalyze={analyze} savedIds={savedIds} onSave={save} apiBase={apiBase}/>}
        {page==="resume" && <ResumeLab job={activeJob} apiBase={apiBase}/>}
        {page==="copilot" && <Copilot job={activeJob}/>}
        {page==="tracker" && <Tracker/>}
        {page==="analytics" && <Analytics/>}
      </div>
      <Assistant/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
